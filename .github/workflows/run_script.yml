name: Kör mitt mail-skript

on:
  schedule:
    - cron: '0 8 24 * *'    
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
    - name: Hämta kod
      uses: actions/checkout@v4

    - name: Sätt upp Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installera python-dotenv
      run: |
        pip install python-dotenv

    - name: Kör skriptet
      env:
        # Dessa hämtas från GitHub Settings -> Secrets
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} 
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      run: python ditt_skriptnamn.py
